name: Deploy

on:
  push:
    branches:
      - test-ci-cd
  pull_request:
    types:
      - closed
    branches:
      - test-ci-cd

jobs:
  deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest

    permissions:
      id-token: write

    steps:
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.IAM_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Execute SSM Command
        run: |
          TARGET_DIR="${{ vars.TARGET_DIR }}"
          REPO_URL="${{ vars.REPO_URL }}"
          REPO_REF="${{ vars.REPO_REF }}"
          AWS_REGION="${{ secrets.AWS_REGION }}"
          SSM_ENV_PARAM_NAME="${{ vars.SSM_ENV_PARAM_NAME }}"
          TARGET_USER="${{ vars.TARGET_USER || 'ubuntu' }}"
          MAX_POLL_TIME="${{ vars.MAX_POLL_TIME || '7500' }}"
          POLL_INTERVAL="${{ vars.POLL_INTERVAL || '10' }}"
          if [[ ! "$MAX_POLL_TIME" =~ ^[1-9][0-9]*$ || ! "$POLL_INTERVAL" =~ ^[1-9][0-9]*$ ]]; then
            echo "MAX_POLL_TIME and POLL_INTERVAL must be positive integers"
            exit 1
          fi
          MAX_ATTEMPTS=$((MAX_POLL_TIME / POLL_INTERVAL))
          if [ "$MAX_ATTEMPTS" -lt 1 ]; then
            echo "MAX_POLL_TIME must be at least POLL_INTERVAL"
            exit 1
          fi

          SSM_COMMANDS=$(cat <<EOF
            set -e
            exec 2>&1

            export AWS_DEFAULT_REGION="$AWS_REGION"

            touch /var/lock/cms-lji-deploy.lock
            chown "root:\$(id -gn '$TARGET_USER')" /var/lock/cms-lji-deploy.lock
            chmod 660 /var/lock/cms-lji-deploy.lock
            exec 8>>/var/lock/cms-lji-deploy.lock
            flock -w 300 8 || { echo "Timed out waiting for another host deployment"; exit 1; }

            mkdir -p "$TARGET_DIR"
            chown -R "$TARGET_USER:\$(id -gn '$TARGET_USER')" "$TARGET_DIR"

            if ! command -v aws &> /dev/null; then
              echo "Installing AWS CLI..."
              curl -fsSL https://awscli.amazonaws.com/v2/install.sh | sudo bash -s -- --system
            fi

            runuser -u "$TARGET_USER" -- env \
              TARGET_DIR="$TARGET_DIR" \
              REPO_URL="$REPO_URL" \
              REPO_REF="$REPO_REF" \
              AWS_REGION="$AWS_REGION" \
              SSM_ENV_PARAM_NAME="$SSM_ENV_PARAM_NAME" \
              DEPLOY_LOCK_HELD=true \
              bash -c '
                set -e
                exec 2>&1

                export AWS_DEFAULT_REGION="$AWS_REGION"

                if [ -d "$TARGET_DIR/.git" ]; then
                  echo "Updating existing repository at $TARGET_DIR..."
                  cd "$TARGET_DIR"
                  git fetch origin
                  git checkout "$REPO_REF"
                  git reset --hard "origin/$REPO_REF"
                else
                  echo "Cloning new repository into $TARGET_DIR..."
                  git clone -b "$REPO_REF" "$REPO_URL" "$TARGET_DIR"
                  cd "$TARGET_DIR"
                fi

                echo "Current HEAD"
                git -C "$TARGET_DIR" rev-parse HEAD

                echo "Writing .env file from SSM Parameter Store..."
                aws ssm get-parameter \
                  --name "$SSM_ENV_PARAM_NAME" \
                  --with-decryption \
                  --query "Parameter.Value" \
                  --output text > "$TARGET_DIR/deploy/deploy.env"
                chmod 600 "$TARGET_DIR/deploy/deploy.env"

                cd "$TARGET_DIR/deploy/hosts"
                sudo ./setup-cms-system.sh

                cd "$TARGET_DIR/deploy/services"
                ./cms.sh
              '

          EOF
          )

          PAYLOAD=$(echo "$SSM_COMMANDS" | jq -R -s -c 'split("\n")')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --timeout-seconds 3600 \
            --parameters "{\"commands\": $PAYLOAD, \"executionTimeout\": [\"3600\"]}" \
            --query "Command.CommandId" \
            --output text)

          echo "Sent SSM command: $COMMAND_ID"

          STATUS="InProgress"
          ATTEMPTS=0

          while [ "$STATUS" = "InProgress" ] || [ "$STATUS" = "Pending" ] || [ "$STATUS" = "Delayed" ] || [ "$STATUS" = "Cancelling" ]; do
            if [ $ATTEMPTS -ge $MAX_ATTEMPTS ]; then
              echo "Timed out waiting for SSM command"
              break
            fi
            sleep $POLL_INTERVAL
            ATTEMPTS=$((ATTEMPTS+1))
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.INSTANCE_ID }}" \
              --query "Status" \
              --output text 2>/dev/null || echo "InProgress")
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.INSTANCE_ID }}" \
            --query "StandardOutputContent" \
            --output text

          echo "Deployment: $STATUS"
          if [ "$STATUS" != "Success" ]; then
            exit 1
          fi
