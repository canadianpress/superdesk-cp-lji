services:
  redis:
    image: redis:${REDIS_VERSION:-5.0}
    ports:
      - "6379:6379"
    restart: unless-stopped

  mongo:
    image: mongo:${MONGO_VERSION:-4.4}
    platform: linux/amd64
    ports:
      - "27017:27017"
    restart: unless-stopped

  elastic:
    image: elasticsearch:${ELASTICSEARCH_VERSION:-7.17.10}
    environment:
      - discovery.type=single-node
    ports:
      - "9200:9200"
    restart: unless-stopped
